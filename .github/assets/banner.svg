<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="card">
      <rect x="490" y="50" width="220" height="220" rx="32" ry="32"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" fill="#000000"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <rect x="490" y="50" width="220" height="220" rx="32" ry="32" fill="#fae9e9"/>
  <g clip-path="url(#card)">
    <image href="logo.png" x="529" y="70" width="141" height="160"/>
  </g>

  <text x="600" y="335" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="64" fill="#ffffff">ludens</text>
  <text x="600" y="373" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" letter-spacing="0.3" fill="#ffffff" fill-opacity="0.78">Plataforma de Venda de Ingressos para Teatro Comunitário</text>
</svg>
